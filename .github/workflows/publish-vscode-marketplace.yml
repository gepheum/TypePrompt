name: Publish VS Code extension to Visual Studio Marketplace

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VS Code extension and dependencies
        run: |
          npm run build --workspace=@typeprompt/core
          npm run build --workspace=@typeprompt/formatter
          npm run build --workspace=@typeprompt/inference-runner
          npm run build --workspace=@typeprompt/inference-element
          npm run build --workspace=@typeprompt/language-server
          npm run build --workspace=typeprompt-vscode

      - name: Package .vsix
        run: npm run package --workspace=typeprompt-vscode

      - name: Publish to Visual Studio Marketplace
        run: npx --yes @vscode/vsce publish --oidc --packagePath packages/vscode/*.vsix
